body:
  text: 上清經祕訣靈寳鍊度五仙安靈鎮神黃繒章法上清太微帝君結帶眞文法上清經祕訣按經旨叩齒思神默想念之乃得飛昇夫大道一乘分爲三洞故教開漸頓人有賢愚設法隨機要在合道然戒以防非止惡制斷六情籙者進品登仙遠超三界故道性品云戒行攝衆生籙引歸真一自淺之深非無優劣從凡入聖各有等差以正一仙靈爲初戒以玉清昇玄爲畢籙通玄合道契真言象以宗其道師其人行其教遵其禮朕聞寥廓之際真宰存焉溟涬之初聖人利見其教善貸而不有其道日用而惟新則焕乎雲篆仙書祕于瑶篇玉簡非握圖受籙之主不能行其教非栖真擇賢之士不得闚其文明真有五科太上留十戒我國家胄白雲之積慶承玄元之妙旨合德二儀同光五聖皆以至道滋萬類敦德臨兆人上清經云三洞者一曰洞真二曰洞玄三曰洞神各有一十二門分爲三十六部尊經上應三清三十六天下應九壘三十六宫府故人頭有九宫心有九孔臍有九神形有九户三十六所也九天生神經云人受生於胞胎之中三元育養九氣結形九月神布氣滿能聲身尚神具九天稱慶太一執符帝君品命主録勒籍司命定筭五帝監生聖母衛房天神地祇三界齊臨亦不輕也登真隱訣云所論一理者即是一切衆生身中清净道性道性者不有不無真性常在所以通之爲道道者有而無形形而有情變化不測通於群生在人之身爲神明所以爲心也所以教人修心即修道也教人修道即修心也道不可見因生以明之生不可常用道以守之生亡則道廢合道則長生也上清經祕訣
  hash: sha256:6e9c52b89d248276a76259f9765efa965a484c9208315a7eb752ddabe3523784
